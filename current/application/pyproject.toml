[project]
name = "cre-foundry"
version = "0.1.0"
description = "Local-first commercial real estate data acquisition, evidence, event detection, and decision system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "orjson>=3.11.9",
    "platformdirs>=4.11.0",
    "polars>=1.43.0",
    "prefect>=3.8.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "shapely>=2.1.2",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.0",
]

[project.scripts]
cre-foundry = "cre_foundry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cre_foundry"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cre_foundry"]

[dependency-groups]
dev = [
    "bandit[toml]==1.9.4",
    "detect-secrets==1.5.0",
    "mypy>=2.3.0",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260724",
]
