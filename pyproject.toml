[project]
name = "cre-foundry"
version = "1.0.0"
description = "Evidence-first commercial real estate signal pipeline for account prioritization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "rapidfuzz>=3.9",
  "rich>=13.7",
  "typer>=0.12"
]

[project.scripts]
cre-foundry = "cre_foundry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cre_foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
